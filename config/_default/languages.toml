# Languages
#   English lives in `content/`, Traditional Chinese in `content_zh/` (same file paths, so each
#   Chinese page is automatically linked to its English counterpart for the language toggle).
#   Menus are per language: `menus.en.toml` / `menus.zh.toml`. Interface strings: `i18n/`.

[en]
  languageCode = "en-us"
  languageName = "English"
  weight = 1
  contentDir = "content"
  [en.params]
    lang_label = "EN"

[zh]
  languageCode = "zh-Hant"
  languageName = "中文"
  weight = 2
  contentDir = "content_zh"
  [zh.params]
    lang_label = "中"
    date_format = "2006年1月2日"
  [zh.params.publications]
    date_format = "2006年1月"
    citation_style = "apa"
